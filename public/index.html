<!doctype html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DJ Assistant</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090d12;
      --panel: #111923;
      --panel2: #17222e;
      --line: #263544;
      --text: #edf4f8;
      --muted: #9aabb8;
      --green: #1ed760;
      --blue: #56b4ff;
      --red: #ff5e6c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      background: radial-gradient(ellipse at top, #152330 0, var(--bg) 58%);
      color: var(--text);
      font: 16px Arial, sans-serif;
    }

    main { max-width: 900px; margin: 0 auto; }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 42px); }
    h2 { margin: 0 0 16px; font-size: 20px; }
    p { color: var(--muted); line-height: 1.5; }

    .box {
      margin: 18px 0;
      padding: 20px;
      background: linear-gradient(145deg, var(--panel2), var(--panel));
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 12px 32px #0005;
    }

    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

    button, select, textarea {
      font: inherit;
      border-radius: 9px;
      padding: 11px 13px;
    }

    button {
      border: 0;
      background: var(--green);
      color: #06120a;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary { background: #294052; color: var(--text); }
    button.stop { background: var(--red); color: #190508; }
    button:disabled { opacity: .5; cursor: not-allowed; }

    select, textarea {
      background: #0c131b;
      color: var(--text);
      border: 1px solid var(--line);
    }

    select { min-width: 220px; max-width: 100%; }
    textarea { width: 100%; resize: vertical; }
    .status { color: var(--muted); min-height: 24px; margin-top: 12px; }
    .track { font-size: 20px; font-weight: 700; margin: 8px 0; }
    .meta { color: var(--muted); }
    .card {
      background: #0d151d;
      border: 1px solid var(--line);
      padding: 12px;
      border-radius: 10px;
      margin-top: 8px;
    }

    a { color: var(--green); }
  </style>
</head>
<body>
<main>
  <h1>🎧 DJ Assistant</h1>
  <p>Identifică piesa auzită, caut-o pe Spotify și găsește următoarele piese compatibile din biblioteca locală.</p>

  <section class="box">
    <h2>1. Intrare audio</h2>
    <div class="row">
      <select id="micSelect">
        <option value="">Încarcă intrările audio…</option>
      </select>
      <button id="loadMicsBtn" class="secondary">Reîncarcă intrările</button>
      <button id="startBtn">Pornește ascultarea</button>
      <button id="stopBtn" class="stop" disabled>Oprește</button>
    </div>
    <div id="micStatus" class="status">Alege microfonul sau interfața audio.</div>
  </section>

  <section class="box">
    <h2>2. Piesa identificată</h2>
    <div id="trackResult" class="meta">Încă nu a fost identificată nicio piesă.</div>
    <div id="recommendations"></div>
    <div id="recognitionStatus" class="status"></div>
  </section>

  <section class="box">
    <h2>3. Anunț vocal</h2>
    <textarea id="announcement" rows="3">Salutare, bine ați venit la petrecere!</textarea>
    <div class="row" style="margin-top:10px">
      <button id="speakBtn">▶ Redă anunțul</button>
      <button id="downloadBtn" class="secondary">⬇ Descarcă audio</button>
      <button id="stopSpeechBtn" class="stop">Oprește anunțul</button>
    </div>
    <div id="speechStatus" class="status"></div>
  </section>
</main>

<script>
  const micSelect = document.getElementById("micSelect");
  const micStatus = document.getElementById("micStatus");
  const recognitionStatus = document.getElementById("recognitionStatus");
  const trackResult = document.getElementById("trackResult");
  const recommendations = document.getElementById("recommendations");

  let stream = null;
  let recorder = null;
  let chunks = [];
  let captureTimer = null;

  async function loadMics() {
    try {
      // Cererea de permisiune face numele dispozitivelor vizibile în browser.
      const temp = await navigator.mediaDevices.getUserMedia({ audio: true });
      temp.getTracks().forEach(track => track.stop());

      const devices = await navigator.mediaDevices.enumerateDevices();
      const inputs = devices.filter(device => device.kind === "audioinput");

      micSelect.innerHTML = "";
      inputs.forEach((device, index) => {
        const option = document.createElement("option");
        option.value = device.deviceId;
        option.textContent = device.label || `Intrare audio ${index + 1}`;
        micSelect.appendChild(option);
      });

      if (!inputs.length) {
        micSelect.innerHTML = '<option value="">Nu s-au găsit intrări audio</option>';
      }

      micStatus.textContent = "Selectează intrarea audio, apoi pornește ascultarea.";
    } catch (error) {
      micStatus.textContent = "Permite accesul la microfon în browser.";
      console.error(error);
    }
  }

  async function startListening() {
    if (!micSelect.value) {
      await loadMics();
      if (!micSelect.value) return;
    }

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { deviceId: { exact: micSelect.value } }
      });

      document.getElementById("startBtn").disabled = true;
      document.getElementById("stopBtn").disabled = false;
      micStatus.textContent = "Ascult. Trimit periodic audio către AudD pentru identificare.";

      // AudD lucrează pe un fragment audio; se trimit fragmente de 10 secunde.
      captureTimer = setInterval(recordFragment, 12000);
      recordFragment();
    } catch (error) {
      micStatus.textContent = "Nu s-a putut porni dispozitivul audio.";
      console.error(error);
    }
  }

  function recordFragment() {
    if (!stream || recorder?.state === "recording") return;

    chunks = [];
    const options = MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
      ? { mimeType: "audio/webm;codecs=opus" }
      : {};

    recorder = new MediaRecorder(stream, options);
    recorder.ondataavailable = event => {
      if (event.data.size) chunks.push(event.data);
    };

    recorder.onstop = async () => {
      const blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
      if (blob.size > 1000) await identifyTrack(blob);
    };

    recorder.start();
    setTimeout(() => {
      if (recorder?.state === "recording") recorder.stop();
    }, 10000);
  }

  async function identifyTrack(blob) {
    recognitionStatus.textContent = "Caut piesa cu AudD…";

    const form = new FormData();
    form.append("audio", blob, "capture.webm");

    try {
      const response = await fetch("/api/recognize", {
        method: "POST",
        body: form
      });

      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Identificarea a eșuat.");

      const track = data.track;
      trackResult.innerHTML = `
        <div class="track">${escapeHtml(track.title)} — ${escapeHtml(track.artist)}</div>
        <div class="meta">
          ${track.album ? `Album: ${escapeHtml(track.album)} · ` : ""}
          ${track.bpm ? `BPM: ${track.bpm} · Key: ${escapeHtml(track.key)}` : "BPM/key nu sunt în library.json"}
        </div>
        <p><a href="${escapeHtml(track.spotifyUrl)}" target="_blank" rel="noopener">Caută/deschide pe Spotify ↗</a></p>
      `;

      recommendations.innerHTML = "";
      if (data.recommendations?.length) {
        recommendations.innerHTML = "<h3>Recomandări compatibile</h3>" +
          data.recommendations.map(item => `
            <div class="card">
              <strong>${escapeHtml(item.title)} — ${escapeHtml(item.artist)}</strong>
              <div class="meta">
                ${item.bpm} BPM · ${escapeHtml(item.key)} · diferență ${item.bpmDifference} BPM
              </div>
              <a target="_blank" rel="noopener"
                 href="https://open.spotify.com/search/${encodeURIComponent(item.artist + " " + item.title)}">
                Caută pe Spotify ↗
              </a>
            </div>
          `).join("");
      }

      recognitionStatus.textContent = data.message || "Piesa a fost identificată.";
    } catch (error) {
      recognitionStatus.textContent = error.message;
    }
  }

  function stopListening() {
    clearInterval(captureTimer);
    captureTimer = null;

    if (recorder?.state === "recording") recorder.stop();
    if (stream) stream.getTracks().forEach(track => track.stop());

    stream = null;
    recorder = null;
    document.getElementById("startBtn").disabled = false;
    document.getElementById("stopBtn").disabled = true;
    micStatus.textContent = "Ascultarea s-a oprit.";
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, char => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[char]);
  }

  document.getElementById("loadMicsBtn").addEventListener("click", loadMics);
  document.getElementById("startBtn").addEventListener("click", startListening);
  document.getElementById("stopBtn").addEventListener("click", stopListening);
  navigator.mediaDevices.addEventListener?.("devicechange", loadMics);

  // Redare cu o voce română instalată în browser/sistem.
  document.getElementById("speakBtn").addEventListener("click", () => {
    const text = document.getElementById("announcement").value.trim();
    const status = document.getElementById("speechStatus");
    const voice = speechSynthesis.getVoices()
      .find(item => item.lang.toLowerCase().startsWith("ro"));

    if (!text) return;
    if (!voice) {
      status.textContent = "Browserul nu are instalată o voce română.";
      return;
    }

    speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = "ro-RO";
    utterance.voice = voice;
    speechSynthesis.speak(utterance);
    status.textContent = "Redau anunțul în română.";
  });

  document.getElementById("stopSpeechBtn").addEventListener("click", () => {
    speechSynthesis.cancel();
  });

  document.getElementById("downloadBtn").addEventListener("click", async () => {
    const text = document.getElementById("announcement").value.trim();
    const status = document.getElementById("speechStatus");

    if (!text) {
      status.textContent = "Scrie mai întâi textul anunțului.";
      return;
    }

    status.textContent = "Generez fișierul audio…";

    try {
      const response = await fetch(`/api/tts?text=${encodeURIComponent(text)}`);
      if (!response.ok) throw new Error(await response.text());

      const blob = await response.blob();
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "anunt-audio";
      link.click();
      URL.revokeObjectURL(url);
      status.textContent = "Descărcarea a început.";
    } catch (error) {
      status.textContent = "Descărcarea TTS a eșuat: " + error.message;
    }
  });

  speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
  loadMics();
</script>
</body>
</html>
