<!doctype html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DJ Assistant</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 24px; color: #eef5f8;
      background: #090e14; font: 16px Arial, sans-serif;
    }
    main { max-width: 900px; margin: auto; }
    h1 { color: #1ed760; }
    h2 { margin-top: 0; }
    .box {
      margin: 18px 0; padding: 20px; border-radius: 15px;
      background: #121c26; border: 1px solid #283746;
    }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    button, select, textarea {
      padding: 11px; border-radius: 8px; font: inherit;
    }
    button { border: 0; background: #1ed760; color: #061109; cursor: pointer; }
    button.secondary { background: #304456; color: white; }
    button.stop { background: #e84d5b; color: white; }
    button:disabled { opacity: .5; }
    select, textarea {
      color: white; background: #0b1219; border: 1px solid #344656;
    }
    select { min-width: 230px; max-width: 100%; }
    textarea { width: 100%; margin: 8px 0; }
    .status, .muted { color: #a9b8c4; margin-top: 12px; }
    .track { font-size: 21px; font-weight: bold; }
    .card { padding: 12px; margin-top: 10px; background: #0c141c; border-radius: 9px; }
    a { color: #1ed760; }
  </style>
</head>
<body>
<main>
  <h1>🎧 DJ Assistant</h1>
  <p class="muted">Ascultă, identifică piesa cu AudD și caut-o pe Spotify.</p>

  <section class="box">
    <h2>Intrare audio</h2>
    <div class="row">
      <select id="micSelect"><option value="">Încarcă intrările audio…</option></select>
      <button id="loadBtn" class="secondary">Reîncarcă intrările</button>
      <button id="startBtn">Pornește</button>
      <button id="stopBtn" class="stop" disabled>Oprește</button>
    </div>
    <div id="micStatus" class="status">Permite accesul la microfon pentru a vedea intrările.</div>
  </section>

  <section class="box">
    <h2>Piesa identificată</h2>
    <div id="track">Nicio piesă identificată încă.</div>
    <div id="recommendations"></div>
    <div id="recognitionStatus" class="status"></div>
  </section>

  <section class="box">
    <h2>Anunț vocal în română</h2>
    <textarea id="announcement" rows="3">Salutare, bine ați venit la petrecere!</textarea>
    <div class="row">
      <button id="speakBtn">▶ Redă anunțul</button>
      <button id="downloadBtn" class="secondary">⬇ Descarcă audio</button>
      <button id="stopSpeechBtn" class="stop">Oprește anunțul</button>
    </div>
    <div id="speechStatus" class="status"></div>
  </section>
</main>

<script>
  const micSelect = document.getElementById("micSelect");
  let stream = null;
  let recorder = null;
  let timer = null;

  async function loadInputs() {
    try {
      const temp = await navigator.mediaDevices.getUserMedia({ audio: true });
      temp.getTracks().forEach(track => track.stop());

      const devices = await navigator.mediaDevices.enumerateDevices();
      const inputs = devices.filter(device => device.kind === "audioinput");

      micSelect.innerHTML = "";
      inputs.forEach((device, i) => {
        const option = document.createElement("option");
        option.value = device.deviceId;
        option.textContent = device.label || `Intrare audio ${i + 1}`;
        micSelect.appendChild(option);
      });

      document.getElementById("micStatus").textContent =
        inputs.length ? "Alege microfonul sau interfața audio." : "Nu s-au găsit intrări audio.";
    } catch {
      document.getElementById("micStatus").textContent =
        "Permite accesul la microfon în browser.";
    }
  }

  async function startListening() {
    try {
      if (!micSelect.value) await loadInputs();
      if (!micSelect.value) return;

      stream = await navigator.mediaDevices.getUserMedia({
        audio: { deviceId: { exact: micSelect.value } }
      });

      document.getElementById("startBtn").disabled = true;
      document.getElementById("stopBtn").disabled = false;
      document.getElementById("micStatus").textContent = "Ascult…";

      capture();
      timer = setInterval(capture, 12000);
    } catch (error) {
      document.getElementById("micStatus").textContent = "Nu s-a putut porni intrarea audio.";
      console.error(error);
    }
  }

  function capture() {
    if (!stream || recorder?.state === "recording") return;

    const chunks = [];
    const mimeType = MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
      ? "audio/webm;codecs=opus"
      : "";

    recorder = new MediaRecorder(stream, mimeType ? { mimeType } : {});
    recorder.ondataavailable = event => {
      if (event.data.size) chunks.push(event.data);
    };

    recorder.onstop = () => {
      const blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
      if (blob.size > 1000) identify(blob);
    };

    recorder.start();
    setTimeout(() => {
      if (recorder?.state === "recording") recorder.stop();
    }, 10000);
  }

  async function identify(blob) {
    const status = document.getElementById("recognitionStatus");
    status.textContent = "Caut piesa…";

    const form = new FormData();
    form.append("audio", blob, "capture.webm");

    try {
      const response = await fetch("/api/recognize", { method: "POST", body: form });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Identificarea a eșuat.");

      const track = data.track;
      const spotifyUrl =
        `https://open.spotify.com/search/${encodeURIComponent(track.artist + " " + track.title)}`;

      document.getElementById("track").innerHTML = `
        <div class="track">${escapeHtml(track.title)} — ${escapeHtml(track.artist)}</div>
        <p class="muted">${track.bpm ? `${track.bpm} BPM · ${escapeHtml(track.key)}` : "Adaugă BPM și Camelot key în library.json pentru recomandări."}</p>
        <a href="${spotifyUrl}" target="_blank" rel="noopener">🔎 Caută piesa pe Spotify</a>
      `;

      const list = document.getElementById("recommendations");
      list.innerHTML = data.recommendations?.length
        ? "<h3>Recomandări</h3>" + data.recommendations.map(item => `
            <div class="card">
              <strong>${escapeHtml(item.title)} — ${escapeHtml(item.artist)}</strong>
              <div class="muted">${item.bpm} BPM · ${escapeHtml(item.key)} · diferență ${item.bpmDifference} BPM</div>
              <a target="_blank" rel="noopener"
                 href="https://open.spotify.com/search/${encodeURIComponent(item.artist + " " + item.title)}">
                Caută pe Spotify
              </a>
            </div>
          `).join("")
        : "";

      status.textContent = data.message || "Piesa a fost identificată.";
    } catch (error) {
      status.textContent = error.message;
    }
  }

  function stopListening() {
    clearInterval(timer);
    timer = null;
    if (recorder?.state === "recording") recorder.stop();
    if (stream) stream.getTracks().forEach(track => track.stop());
    stream = null;
    recorder = null;
    document.getElementById("startBtn").disabled = false;
    document.getElementById("stopBtn").disabled = true;
    document.getElementById("micStatus").textContent = "Ascultarea s-a oprit.";
  }

  function escapeHtml(text) {
    return String(text).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);
  }

  document.getElementById("loadBtn").onclick = loadInputs;
  document.getElementById("startBtn").onclick = startListening;
  document.getElementById("stopBtn").onclick = stopListening;

  document.getElementById("speakBtn").onclick = () => {
    const text = document.getElementById("announcement").value.trim();
    const voice = speechSynthesis.getVoices()
      .find(item => item.lang.toLowerCase().startsWith("ro"));

    if (!voice) {
      document.getElementById("speechStatus").textContent =
        "Nu este instalată o voce română în browser sau sistem.";
      return;
    }

    speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = "ro-RO";
    utterance.voice = voice;
    speechSynthesis.speak(utterance);
    document.getElementById("speechStatus").textContent = "Redau anunțul.";
  };

  document.getElementById("stopSpeechBtn").onclick = () => speechSynthesis.cancel();

  document.getElementById("downloadBtn").onclick = async () => {
    const text = document.getElementById("announcement").value.trim();
    const status = document.getElementById("speechStatus");
    if (!text) return;

    status.textContent = "Generez audio pentru descărcare…";

    try {
      const response = await fetch(`/api/tts?text=${encodeURIComponent(text)}`);
      if (!response.ok) throw new Error(await response.text());

      const blob = await response.blob();
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "anunt-audio";
      link.click();
      URL.revokeObjectURL(url);
      status.textContent = "Descărcarea a început.";
    } catch (error) {
      status.textContent = "Eroare TTS: " + error.message;
    }
  };

  speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
  loadInputs();
</script>
</body>
</html>
