<body>
  <h1>🎧 DJ Assistant</h1>

  <div class="box">
    <h2>Selectare microfon / interfață audio</h2>

    <button id="refreshMicsBtn">Încarcă intrările audio</button>
    <select id="micSelect">
      <option value="">Apasă „Încarcă intrările audio”</option>
    </select>

    <button id="startMicBtn">Pornește microfonul</button>
    <button id="stopMicBtn" class="stop" disabled>Oprește microfonul</button>

    <div id="micStatus" class="status">Microfonul nu este pornit.</div>
  </div>

  <div class="box">
    <h2>Anunț vocal în română</h2>

    <textarea id="announcement" rows="3">Salutare, bine ați venit la petrecere!</textarea><br>

    <button id="generateBtn">▶ Redă anunțul</button>
    <button id="stopSpeechBtn" class="stop">Oprește anunțul</button>

    <div id="speechStatus" class="status"></div>
  </div>

  <script>
    const micSelect = document.getElementById("micSelect");
    const micStatus = document.getElementById("micStatus");
    const startMicBtn = document.getElementById("startMicBtn");
    const stopMicBtn = document.getElementById("stopMicBtn");

    let micStream = null;

    async function loadMicrophones() {
      try {
        // Permisiunea este necesară pentru ca browserul să afișeze numele dispozitivelor.
        const permissionStream = await navigator.mediaDevices.getUserMedia({
          audio: true
        });

        permissionStream.getTracks().forEach(track => track.stop());

        const devices = await navigator.mediaDevices.enumerateDevices();
        const microphones = devices.filter(device => device.kind === "audioinput");

        micSelect.innerHTML = "";

        if (microphones.length === 0) {
          micSelect.innerHTML = '<option value="">Nu s-au găsit intrări audio</option>';
          micStatus.textContent = "Nu a fost găsit niciun microfon sau dispozitiv audio.";
          return;
        }

        microphones.forEach((mic, index) => {
          const option = document.createElement("option");
          option.value = mic.deviceId;
          option.textContent = mic.label || `Intrare audio ${index + 1}`;
          micSelect.appendChild(option);
        });

        micStatus.textContent = "Selectează o intrare audio și apasă „Pornește microfonul”.";
      } catch (error) {
        micStatus.textContent =
          "Nu s-a putut accesa microfonul. Verifică permisiunea pentru această pagină.";
        console.error(error);
      }
    }

    async function startMicrophone() {
      if (!micSelect.value) {
        micStatus.textContent = "Încarcă intrările audio și selectează un microfon.";
        return;
      }

      stopMicrophone();

      try {
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            deviceId: { exact: micSelect.value }
          }
        });

        startMicBtn.disabled = true;
        stopMicBtn.disabled = false;
        micStatus.textContent = "Microfonul este pornit.";
      } catch (error) {
        micStatus.textContent =
          "Nu s-a putut porni intrarea selectată. Verifică permisiunile și dispozitivul.";
        console.error(error);
      }
    }

    function stopMicrophone() {
      if (micStream) {
        micStream.getTracks().forEach(track => track.stop());
        micStream = null;
      }

      startMicBtn.disabled = false;
      stopMicBtn.disabled = true;
      micStatus.textContent = "Microfonul nu este pornit.";
    }

    document.getElementById("refreshMicsBtn").addEventListener("click", loadMicrophones);
    startMicBtn.addEventListener("click", startMicrophone);
    stopMicBtn.addEventListener("click", stopMicrophone);

    // Voce română, dacă browserul/sistemul are una instalată.
    function speakRomanian() {
      const text = document.getElementById("announcement").value.trim();
      const status = document.getElementById("speechStatus");

      if (!text) return;

      const voices = speechSynthesis.getVoices();
      const romanianVoice = voices.find(voice =>
        voice.lang.toLowerCase().startsWith("ro")
      );

      if (!romanianVoice) {
        status.textContent =
          "Nu este disponibilă o voce română în browserul sau sistemul tău.";
        return;
      }

      speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "ro-RO";
      utterance.voice = romanianVoice;

      utterance.onstart = () => {
        status.textContent = "Redau anunțul în română…";
      };

      utterance.onend = () => {
        status.textContent = "Anunț terminat.";
      };

      utterance.onerror = () => {
        status.textContent = "Eroare la redarea anunțului.";
      };

      speechSynthesis.speak(utterance);
    }

    document.getElementById("generateBtn").addEventListener("click", speakRomanian);

    document.getElementById("stopSpeechBtn").addEventListener("click", () => {
      speechSynthesis.cancel();
    });

    speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();

    // Reîncarcă lista dacă conectezi/deconectezi un dispozitiv audio.
    navigator.mediaDevices.addEventListener?.("devicechange", () => {
      loadMicrophones();
    });
  </script>
</body>
