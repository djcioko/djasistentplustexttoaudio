<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DJ Assistant + TTS cu descărcare</title>
  <style>
    body { font-family: Arial, sans-serif; background:#111; color:#eee; margin:20px; }
    h1, h2 { color:#1db954; }
    .box { background:#222; padding:16px; margin:15px 0; border-radius:10px; }
    button, select, textarea { padding:10px; margin:5px; font-size:16px; }
    button { background:#1db954; color:white; border:0; border-radius:5px; cursor:pointer; }
    button.stop { background:#b33; }
    .status { color:#ccc; margin:10px 5px; }
    textarea { width:100%; box-sizing:border-box; }
    audio { width:100%; margin-top:10px; }
  </style>
</head>
<body>
  <h1>🎧 DJ Assistant + TTS (cu descărcare)</h1>
  <p>Selectează intrarea audio (Serato, Foobar sau orice alt player). Pagina identifică piesa și îți face recomandări.</p>

  <!-- Păstrează secțiunea de ascultare/identificare din pagina ta originală aici -->

  <div class="box">
    <h2>Anunț vocal în română (calitate bună + descărcare)</h2>
    <textarea id="announcement" rows="3">Salutare, bine ați venit la petrecere!</textarea><br>
    
    <button id="generateBtn">▶ Generează + Redă</button>
    <button id="downloadBtn">⬇ Descarcă MP3</button>
    <button id="stopBtn" class="stop">Oprește</button>
    
    <div id="speechStatus" class="status"></div>
    <audio id="player" controls style="width:100%; display:none;"></audio>
  </div>

  <script>
    let currentAudioBlob = null;
    let currentAudioUrl = null;

    // Folosește Edge TTS printr-un proxy public simplu sau backend-ul tău
    // (pentru demo local poți înlocui cu un endpoint propriu)
    async function generateTTS() {
      const text = document.getElementById("announcement").value.trim();
      if (!text) return;

      const status = document.getElementById("speechStatus");
      status.textContent = "Generez audio în română...";

      try {
        // Exemplu cu un proxy Edge TTS public (poți înlocui cu propriul backend)
        // Sau folosește serviciul tău de pe server
        const response = await fetch("https://api.streamelements.com/kappa/v2/speech?voice=Alina&text=" + encodeURIComponent(text));
        
        if (!response.ok) throw new Error("Eroare TTS");

        currentAudioBlob = await response.blob();
        if (currentAudioUrl) URL.revokeObjectURL(currentAudioUrl);
        currentAudioUrl = URL.createObjectURL(currentAudioBlob);

        const player = document.getElementById("player");
        player.src = currentAudioUrl;
        player.style.display = "block";
        player.play();

        status.textContent = "Gata! Poți reda sau descărca.";
      } catch (e) {
        status.textContent = "Eroare la generare. Încearcă din nou sau folosește un backend propriu.";
        console.error(e);
      }
    }

    function downloadAudio() {
      if (!currentAudioBlob) {
        alert("Generează mai întâi anunțul.");
        return;
      }
      const a = document.createElement("a");
      a.href = currentAudioUrl;
      a.download = "anunt_" + Date.now() + ".mp3";
      a.click();
    }

    document.getElementById("generateBtn").onclick = generateTTS;
    document.getElementById("downloadBtn").onclick = downloadAudio;
    document.getElementById("stopBtn").onclick = () => {
      document.getElementById("player").pause();
    };
  </script>
</body>
</html>
